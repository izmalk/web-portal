ont-size="36" font-weight="600" text-anchor="start" >Release notes</text><circle cx="539" cy="303" r="5" fill="#98753D" /><text x="558" y="308" fill="#5E674F" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="start" >Features</text><line x1="558" y1="330" x2="817" y2="330" stroke="#C0C3B3" stroke-width="6" stroke-linecap="round" /><circle cx="539" cy="376" r="5" fill="#98753D" /><text x="558" y="381" fill="#5E674F" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="start" >Fixes</text><line x1="558" y1="403" x2="789" y2="403" stroke="#C0C3B3" stroke-width="6" stroke-linecap="round" /><circle cx="539" cy="449" r="5" fill="#98753D" /><text x="558" y="454" fill="#5E674F" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="start" >Changes</text><line x1="558" y1="476" x2="836" y2="476" stroke="#C0C3B3" stroke-width="6" stroke-linecap="round" /></g><rect x="733" y="575" width="244" height="42" rx="21" fill="#E9BA6D" fill-opacity=".11"/><text x="855.0" y="603" fill="#E9BA6D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="middle" >Jinja2 templates</text><line x1="64" y1="681" x2="1136" y2="681" stroke="#34444D" stroke-width="1" stroke-linecap="round" /><text x="64" y="717" fill="#9DAFBD" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" >Repository history, shaped into a readable release</text>
