<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
<title id="title">Release Notes Builder</title><desc id="desc">Conceptual illustration of commit and pull request history being organised into a structured release notes document.</desc>
