<radialGradient id="halo"><stop stop-color="#E9BA6D" stop-opacity=".16"/><stop offset="1" stop-color="#E9BA6D" stop-opacity="0"/></radialGradient>
<linearGradient id="base" x2="1" y2="1"><stop stop-color="#17242C"/><stop offset="1" stop-color="#111B22"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#AFCCD7" stroke-opacity=".035" stroke-width="1"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".2"/></filter>
</defs>
<rect width="1200" height="750" fill="url(#base)"/><rect width="1200" height="750" fill="url(#grid)"/>
<ellipse cx="750" cy="330" rx="600" ry="480" fill="url(#halo)"/>
