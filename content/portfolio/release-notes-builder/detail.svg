<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
<title id="title">Release notes generation workflow</title><desc id="desc">GitHub commits and pull requests are gathered, categorised and rendered into release notes using Jinja2 templates.</desc>
<defs>
<radialGradient id="halo"><stop stop-color="#E9BA6D" stop-opacity=".16"/><stop offset="1" stop-color="#E9BA6D" stop-opacity="0"/></radialGradient>
<linearGradient id="base" x2="1" y2="1"><stop stop-color="#17242C"/><stop offset="1" stop-color="#111B22"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#AFCCD7" stroke-opacity=".035" stroke-width="1"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".2"/></filter>
</defs>
<rect width="1200" height="750" fill="url(#base)"/><rect width="1200" height="750" fill="url(#grid)"/>
<ellipse cx="750" cy="330" rx="600" ry="480" fill="url(#halo)"/>
<text x="64" y="95" fill="#EAF2F5" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" text-anchor="start" >A repeatable path from changes to notes</text><rect x="64" y="120" width="238" height="42" rx="21" fill="#E9BA6D" fill-opacity=".11"/><text x="183.0" y="148" fill="#E9BA6D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" text-anchor="middle" >Conceptual overview</text><rect x="64" y="267" width="304" height="226" rx="20" fill="#1D2D36" stroke="#33464F" stroke-width="2" /><circle cx="216.0" cy="334" r="34" fill="#E9BA6D" fill-opacity=".12"/><path d="M207.0 322 l-12 12 12 12 M225.0 322 l12 12 -12 12" stroke="#E9BA6D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="219.0" y1="317" x2="213.0" y2="351" stroke="#E9BA6D" stroke-width="3" stroke-linecap="round" /><text x="216.0" y="403" fill="#EAF2F5" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle" >GitHub history</text><text x="216.0" y="441" fill="#9DAFBD" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" >Commits and pull requests</text><line x1="368" y1="380" x2="448" y2="380" stroke="#E9BA6D" stroke-width="3" stroke-linecap="round" /><circle cx="408.0" cy="380" r="6" fill="#E9BA6D" /><rect x="448" y="267" width="304" height="226" rx="20" fill="#1D2D36" stroke="#33464F" stroke-width="2" /><circle cx="600.0" cy="334" r="34" fill="#E9BA6D" fill-opacity=".12"/><path d="M600.0 316 l24 12 -24 12 -24 -12 z M576.0 338 l24 12 24 -12 M576.0 348 l24 12 24 -12" stroke="#E9BA6D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="600.0" y="403" fill="#EAF2F5" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle" >Categorise</text><text x="600.0" y="441" fill="#9DAFBD" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" >Organise relevant changes</text><line x1="752" y1="380" x2="832" y2="380" stroke="#E9BA6D" stroke-width="3" stroke-linecap="round" /><circle cx="792.0" cy="380" r="6" fill="#E9BA6D" /><rect x="832" y="267" width="304" height="226" rx="20" fill="#1D2D36" stroke="#33464F" stroke-width="2" /><circle cx="984.0" cy="334" r="34" fill="#E9BA6D" fill-opacity=".12"/><rect x="969.0" y="313" width="30" height="42" rx="3" fill="none" stroke="#E9BA6D" stroke-width="2" /><line x1="977.0" y1="327" x2="990.0" y2="327" stroke="#E9BA6D" stroke-width="2" stroke-linecap="round" /><line x1="977.0" y1="336" x2="990.0" y2="336" stroke="#E9BA6D" stroke-width="2" stroke-linecap="round" /><line x1="977.0" y1="345" x2="985.0" y2="345" stroke="#E9BA6D" stroke-width="2" stroke-linecap="round" /><text x="984.0" y="403" fill="#EAF2F5" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle" >Render notes</text><text x="984.0" y="441" fill="#9DAFBD" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" >Jinja2 templates</text><text x="600" y="579" fill="#EAF2F5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="middle" >Use repository evidence as the starting point for release prose.</text><line x1="64" y1="681" x2="1136" y2="681" stroke="#34444D" stroke-width="1" stroke-linecap="round" /><text x="64" y="717" fill="#9DAFBD" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" >Conceptual generation workflow · not a published release</text>
</svg>