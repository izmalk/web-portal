<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
<title id="title">Kafka documentation information architecture</title><desc id="desc">Four documentation modes: tutorials support learning, how-to guides support tasks, reference supports lookup, and explanation supports understanding.</desc>
