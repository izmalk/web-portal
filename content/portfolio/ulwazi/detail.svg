wazi theme</text><text x="600.0" y="441" fill="#9DAFBD" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" >Templates and Vanilla styles</text><line x1="752" y1="380" x2="832" y2="380" stroke="#67D7A5" stroke-width="3" stroke-linecap="round" /><circle cx="792.0" cy="380" r="6" fill="#67D7A5" /><rect x="832" y="267" width="304" height="226" rx="20" fill="#1D2D36" stroke="#33464F" stroke-width="2" /><circle cx="984.0" cy="334" r="34" fill="#67D7A5" fill-opacity=".12"/><circle cx="984.0" cy="334" r="23" fill="none" stroke="#67D7A5" stroke-width="2" /><path d="M984.0 311 C964.0 325 964.0 343 984.0 357 C1004.0 343 1004.0 325 984.0 311" stroke="#67D7A5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="961.0" y1="334" x2="1007.0" y2="334" stroke="#67D7A5" stroke-width="2" stroke-linecap="round" /><text x="984.0" y="403" fill="#EAF2F5" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle" >Documentation</text><text x="984.0" y="441" fill="#9DAFBD" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" >Navigation and reading</text><text x="600" y="579" fill="#EAF2F5" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="middle" >One visual system. Content stays in its source files.</text><line x1="64" y1="681" x2="1136" y2="681" stroke="#34444D" stroke-width="1" stroke-linecap="round" /><text x="64" y="717" fill="#9DAFBD" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" >Conceptual publishing flow · not a screenshot</text>
