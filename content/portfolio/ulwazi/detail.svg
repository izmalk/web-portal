<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
<title id="title">Ulwazi conceptual publishing flow</title><desc id="desc">Sphinx documentation content is rendered through the Ulwazi theme into a readable documentation website.</desc>
