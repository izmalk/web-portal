{{- $src := .Destination -}}
{{- with .Page.Resources.GetMatch .Destination -}}
  {{- $src = .RelPermalink -}}
{{- end -}}
{{- if .IsBlock -}}
<figure class="image-block">
  <a class="image-zoom" data-image-viewer href="{{ $src | safeURL }}" aria-label="Enlarge image{{ with .PlainText }}: {{ . }}{{ end }}">
    <img src="{{ $src | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
  </a>
  {{- with .Title }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>
{{- else -}}
<img src="{{ $src | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
{{- end -}}
