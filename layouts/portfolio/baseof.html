{{ partial "head/head.html" . }}
<body class="portfolio-page{{ if .Site.Params.layoutReverse }} layout-reverse{{ end }}{{ if .Site.Params.dark_mode }} dark-theme{{ end }}">
  <a class="portfolio-skip" href="{{ .RelPermalink }}#main-content">Skip to content</a>
  <div class="wrapper">
    {{ partial "portfolio/sidebar.html" . }}
    <main id="main-content" class="content container portfolio-content" tabindex="-1">
      <div class="portfolio-shell">
        {{ block "main" . }}{{ end }}
      </div>
    </main>
  </div>
</body>
</html>
