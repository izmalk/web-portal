<dialog id="image-viewer" class="image-viewer" aria-labelledby="image-viewer-title">
  <div class="image-viewer-panel">
    <header class="image-viewer-toolbar">
      <h2 id="image-viewer-title">Image preview</h2>
      <div class="image-viewer-actions">
        <button class="image-viewer-zoom" type="button" aria-pressed="false" disabled>Actual size</button>
        <button class="image-viewer-close" type="button" aria-label="Close image preview" autofocus>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="image-viewer-stage" role="region" aria-label="Image preview; scroll to inspect at actual size" tabindex="0">
      <p class="image-viewer-status" role="status">Loading image…</p>
      <p class="image-viewer-error" role="alert" hidden>This image could not be loaded. <a class="image-viewer-original" href="#">Open the original image</a>.</p>
      <img class="image-viewer-image" alt="" hidden>
    </div>
    <p id="image-viewer-caption" class="image-viewer-caption" hidden></p>
  </div>
</dialog>
