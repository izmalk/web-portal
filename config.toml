baseURL = "https://izmalk.com/"
languageCode = "en-us"
title = "Vladimir Izmalkov"
theme = "poison"
[pagination]
    pagerSize = 10
pluralizelisttitles = false   # removes the automatically appended "s" on sidebar entries

# Google Analytics is injected by the theme in production builds
# (see themes/poison/layouts/partials/head/scripts.html).
[params.google.analytics]
    trackerID = "G-03S8GTWJM8"

[params]
    brand = "Vladimir Izmalkov"           # name of your site - appears in the sidebar
    brand_image = "/images/guy.jpg"        # path to the image shown in the sidebar
    description = "Documentation engineer. Technical writer, mentor, and team leader with 15+ years in IT."
    dark_mode = true                       # optional - defaults to false
    favicon = "/favicon.ico"               # path to favicon

    front_page_content = ["posts"]         # page bundles listed on the front page

    # MENU PLACEHOLDER
    # Menu dict keys:
        # Name:         The name to display on the menu.
        # URL:          The directory relative to the content directory.
        # HasChildren:  If the directory's files should be listed.  Default is true.
        # Limit:        If the files should be listed, how many should be shown.
    menu = [
        {Name = "Home", URL = "/", HasChildren = false},
        {Name = "About", URL = "/about/", HasChildren = false},
        {Name = "Summary", URL = "/summary/", HasChildren = false},
        {Name = "Education", URL = "/education/", HasChildren = false},
        {Name = "Work experience", URL = "/work-experience/", HasChildren = false},
        {Name = "Mentorship", URL = "/mentorship/", HasChildren = false},
        {Name = "Posts", URL = "/posts/", Pre = "Recent", HasChildren = true, Limit = 5},
    ]

    # Links to your socials.  Comment or delete any you don't need/use.
    email_url = "mailto://job@izmalk.uk"
    github_url = "https://github.com/izmalk"
    linkedin_url = "https://www.linkedin.com/in/vaizmalkov"
    telegram_url = "https://t.me/BoBacTbli"

    # NOTE: If you don't want to use RSS, comment or delete the following lines
    # Adds an RSS icon to the end of the socials which links to {{ .Site.BaseURL }}/index.xml
    rss_icon = true
    # Which section the RSS icon links to, defaults to all content. See https://gohugo.io/templates/rss/#section-rss
    rss_section = "posts"

    # Dark slate sidebar in both modes, with the original emerald portrait ring.
    moon_sun_background_color = "#5C636B"
    moon_sun_color = "#EEF0F1"
    sidebar_a_color = "#EEF0F1"
    sidebar_bg_color = "#262F39"
    sidebar_h1_color = "#F3F4F4"
    sidebar_img_border_color = "#55C995"
    sidebar_p_color = "#B4C1CE"
    sidebar_socials_color = "#EEF0F1"

    # Light mode: near-white page with slate text and a deeper emerald for links.
    code_color = "#283440"
    code_background_color = "#EDF2F8"
    code_block_color = "#EDF0F2"
    code_block_background_color = "#262F39"
    content_bg_color = "#F7F9FC"
    date_color = "#526579"
    link_color = "#126B45"
    list_color = "#435569"
    post_title_color = "#283440"
    table_border_color = "#CCD6E0"
    table_stripe_color = "#EDF2F8"
    text_color = "#283440"

    # Dark mode: slate page with the original emerald accents.
    code_color_dark = "#E0E7EF"
    code_background_color_dark = "#222D39"
    code_block_color_dark = "#EDF0F2"
    code_block_background_color_dark = "#262F39"
    content_bg_color_dark = "#181E25"
    date_color_dark = "#A6B5C6"
    link_color_dark = "#55C995"
    list_color_dark = "#BECBD8"
    post_title_color_dark = "#E7EDF4"
    table_border_color_dark = "#45576A"
    table_stripe_color_dark = "#222D39"
    text_color_dark = "#E0E7EF"

[taxonomies]
    series = 'series'
    tags = 'tags'

[markup]
    [markup.highlight]
        noClasses = false
